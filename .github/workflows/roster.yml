name: Roster and committees
on:
  schedule:
    - cron: "31 12 * * 1"
    - cron: "45 13 4,5,6,10,15,20 1 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Update people.json from congress-legislators
        run: python scripts/update_roster.py
      - name: Commit if changed
        run: |
          git config user.name "roster-bot"
          git config user.email "roster-bot@users.noreply.github.com"
          git add people.json
          git diff --cached --quiet || git commit -m "Roster: $(date -u +%Y-%m-%d)"
          git push
